name: Phase2 Package Build

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Run every 6 hours to pick up feed changes
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Build specific architecture (or "all" for all architectures)'
        required: false
        default: 'all'
      openwrt_branch:
        description: 'OpenWrt branch to use'
        required: false
        default: 'main'

env:
  OPENWRT_REPO: https://codeberg.org/openwrt/openwrt.git
  OPENWRT_BRANCH: ${{ inputs.openwrt_branch || 'main' }}
  DOWNLOAD_BASE: https://downloads.openwrt.org/snapshots/targets

jobs:
  discover-targets:
    name: Discover build targets
    runs-on: docker
    outputs:
      architectures: ${{ steps.get-arches.outputs.architectures }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y jq

      - name: Checkout buildbot repo
        uses: actions/checkout@v4

      - name: Clone OpenWrt source
        run: |
          if [ -d openwrt ]; then
            cd openwrt
            git fetch origin
            git checkout origin/${{ env.OPENWRT_BRANCH }}
          else
            git clone --depth=1 --branch=${{ env.OPENWRT_BRANCH }} ${{ env.OPENWRT_REPO }} openwrt
          fi

      - name: Discover architectures
        id: get-arches
        run: |
          cd openwrt
          mkdir -p tmp

          # Get all architectures: "arch target/subtarget"
          ./scripts/dump-target-info.pl architectures > tmp/architectures.txt

          # Convert to JSON array for matrix
          # Format: ["target:subtarget:arch", ...]
          # We combine into a single string because matrix doesn't support complex objects
          # Use colon separator to avoid conflicts with dashes in names
          ARCHES_JSON=$(awk '{
            split($2, ts, "/");
            printf "\"%s:%s:%s\"\n", ts[1], ts[2], $1
          }' tmp/architectures.txt | jq -s -c '.')

          echo "Found architectures:"
          echo "$ARCHES_JSON" | jq .

          # Filter if specific architecture requested
          if [ "${{ inputs.architecture }}" != "all" ] && [ -n "${{ inputs.architecture }}" ]; then
            ARCHES_JSON=$(echo "$ARCHES_JSON" | jq -c --arg arch "${{ inputs.architecture }}" '[.[] | select(endswith(":" + $arch))]')
            echo "Filtered to: $ARCHES_JSON"
          fi

          echo "Setting output architectures=$ARCHES_JSON"
          echo "architectures=$ARCHES_JSON" >> "$GITHUB_OUTPUT"

          echo "Verifying output was set:"
          cat "$GITHUB_OUTPUT"

  build-packages:
    name: Build ${{ matrix.target_combo }}
    runs-on: docker
    strategy:
      matrix:
        target_combo:
          - "bcm27xx:bcm2710:aarch64_cortex-a53"
          - "bcm27xx:bcm2711:aarch64_cortex-a72"
          - "bcm27xx:bcm2712:aarch64_cortex-a76"
          - "armsr:armv8:aarch64_generic"
          - "bcm27xx:bcm2708:arm_arm1176jzf-s_vfp"
          - "at91:sam9x:arm_arm926ej-s"
          - "armsr:armv7:arm_cortex-a15_neon-vfpv4"
          - "at91:sama5:arm_cortex-a5_vfpv4"
          - "mediatek:mt7629:arm_cortex-a7"
          - "bcm27xx:bcm2709:arm_cortex-a7_neon-vfpv4"
          - "at91:sama7:arm_cortex-a7_vfpv4"
          - "omap:generic:arm_cortex-a8_vfpv3"
          - "bcm53xx:generic:arm_cortex-a9"
          - "imx:cortexa9:arm_cortex-a9_neon"
          - "mvebu:cortexa9:arm_cortex-a9_vfpv3-d16"
          - "gemini:generic:arm_fa526"
          - "kirkwood:generic:arm_xscale"
          - "ixp4xx:generic:armeb_xscale"
          - "x86:legacy:i386_pentium-mmx"
          - "x86:generic:i386_pentium4"
          - "loongarch64:generic:loongarch64_generic"
          - "malta:be64:mips64_mips64r2"
          - "octeon:generic:mips64_octeonplus"
          - "malta:le64:mips64el_mips64r2"
          - "ath79:generic:mips_24kc"
          - "bmips:bcm6318:mips_mips32"
          - "malta:le:mipsel_24kc"
          - "pistachio:generic:mipsel_24kc_24kf"
          - "bcm47xx:mips74k:mipsel_74kc"
          - "bcm47xx:generic:mipsel_mips32"
          - "qoriq:generic:powerpc64_e5500"
          - "apm821xx:nand:powerpc_464fp"
          - "mpc85xx:p1010:powerpc_8548"
          - "d1:generic:riscv64_generic"
          - "x86:64:x86_64"
      fail-fast: false
      max-parallel: 4

    steps:
      - name: Parse target combination
        id: parse
        run: |
          echo "Received target_combo: ${{ matrix.target_combo }}"
          # Split target_combo into components: target:subtarget:arch
          IFS=':' read -r TARGET SUBTARGET ARCH <<< "${{ matrix.target_combo }}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "subtarget=$SUBTARGET" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "Parsed: TARGET=$TARGET, SUBTARGET=$SUBTARGET, ARCH=$ARCH"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y jq zstd

      - name: Checkout buildbot repo
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          echo "Building packages for ${{ steps.parse.outputs.arch }} (${{ steps.parse.outputs.target }}/${{ steps.parse.outputs.subtarget }})"
          mkdir -p sdk
          mkdir -p "$HOME/dl"

      - name: Download SDK
        run: |
          SDK_URL="${{ env.DOWNLOAD_BASE }}/${{ steps.parse.outputs.target }}/${{ steps.parse.outputs.subtarget }}"
          echo "Looking for SDK at: $SDK_URL"

          # Find SDK filename
          SDK_FILE=$(curl -s "${SDK_URL}/sha256sums" | grep -oP 'openwrt-sdk-[^*]+\.tar\.\w+' | head -1)

          if [ -z "$SDK_FILE" ]; then
            echo "ERROR: Could not find SDK file in sha256sums"
            exit 1
          fi

          echo "Downloading SDK: $SDK_FILE"
          curl -L -o sdk.archive "${SDK_URL}/${SDK_FILE}"

          # Verify download
          if [ ! -s sdk.archive ]; then
            echo "ERROR: SDK download failed or empty"
            exit 1
          fi

          echo "SDK downloaded successfully: $(ls -lh sdk.archive)"

      - name: Unpack SDK
        run: |
          rm -rf sdk_update
          mkdir sdk_update
          tar --strip-components=1 -C sdk_update/ -xf sdk.archive
          rsync -a --checksum sdk_update/ sdk/
          rm -rf sdk_update

      - name: Sanitize host command symlinks
        run: |
          find sdk/staging_dir/host/bin/ -type l -exec sh -c '
            case $(readlink {}) in
              /bin/*|/usr/bin/*) true;;
              /*) rm -vf {};;
            esac
          ' \;

      - name: Get SDK version
        id: sdk-version
        run: |
          cd sdk
          cat > getversion.mk << 'EOF'
          TOPDIR:=${CURDIR}
          include $(TOPDIR)/include/version.mk
          version:
          	@echo $(VERSION_NUMBER)
          EOF
          VERSION=$(make -f getversion.mk)
          echo "SDK version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup download directory
        run: |
          mkdir -p "$HOME/dl"
          rm -rf sdk/dl
          ln -sf "$HOME/dl" sdk/dl

      - name: Configure SDK
        run: |
          cd sdk
          rm -f .config
          make defconfig

      - name: Setup ccache
        run: |
          cd sdk
          ../scripts/ccache.sh

      - name: Update feeds
        run: |
          cd sdk
          ./scripts/feeds update -f

      - name: Install feeds
        run: |
          cd sdk
          ./scripts/feeds install -a

      - name: Generate feeds.conf
        run: |
          cd sdk
          ./scripts/feeds list -s -f > bin/packages/${ARCH}/feeds.conf || mkdir -p bin/packages/${ARCH}
          ./scripts/feeds list -s -f > bin/packages/${ARCH}/feeds.conf

      - name: Clear previous logs
        run: |
          cd sdk
          rm -rf logs/package/error.txt faillogs/

      - name: Build packages
        run: |
          cd sdk
          make -j$(nproc) \
            IGNORE_ERRORS="n m y" \
            BUILD_LOG=1 \
            CONFIG_AUTOREMOVE=y \
            CONFIG_SIGNED_PACKAGES= \
            V=s

      - name: Calculate checksums
        run: |
          cd sdk/bin/packages/${{ steps.parse.outputs.arch }}
          find . -type f -not -name 'sha256sums' -printf '%P\n' | \
            sort | \
            xargs -r ../../staging_dir/host/bin/mkhash -n sha256 | \
            sed -ne 's!^\(.*\) \(.*\)$!\1 *\2!p' > sha256sums

      - name: Prepare package upload
        if: ${{ vars.RSYNC_BIN_URL != '' }}
        env:
          RSYNC_PASSWORD: ${{ secrets.RSYNC_BIN_PASSWORD }}
        run: |
          cd sdk
          # Create target directory structure
          rsync -4 -v --timeout=120 -a \
            --include "/${{ steps.parse.outputs.arch }}/" \
            --exclude "/*" \
            --exclude "/${{ steps.parse.outputs.arch }}/*" \
            bin/packages/ \
            "${{ vars.RSYNC_BIN_URL }}/packages/"

      - name: Upload packages
        if: ${{ vars.RSYNC_BIN_URL != '' }}
        env:
          RSYNC_PASSWORD: ${{ secrets.RSYNC_BIN_PASSWORD }}
        run: |
          cd sdk
          rsync -4 -v --timeout=120 \
            --delay-updates \
            --partial-dir=".~tmp~${{ steps.parse.outputs.arch }}" \
            -a \
            bin/packages/${{ steps.parse.outputs.arch }}/ \
            "${{ vars.RSYNC_BIN_URL }}/packages/${{ steps.parse.outputs.arch }}/"

      - name: Prune old packages
        if: ${{ vars.RSYNC_BIN_URL != '' }}
        env:
          RSYNC_PASSWORD: ${{ secrets.RSYNC_BIN_PASSWORD }}
        run: |
          cd sdk
          rsync -4 -v --timeout=120 \
            --delete \
            --existing \
            --ignore-existing \
            --delay-updates \
            --partial-dir=".~tmp~${{ steps.parse.outputs.arch }}" \
            -a \
            bin/packages/${{ steps.parse.outputs.arch }}/ \
            "${{ vars.RSYNC_BIN_URL }}/packages/${{ steps.parse.outputs.arch }}/"

      - name: Collect failure logs
        if: always()
        run: |
          cd sdk
          mkdir -p faillogs
          if [ -f logs/package/error.txt ]; then
            sed -ne 's!^ *ERROR: package/feeds/\([^ ]*\) .*$!\1!p' logs/package/error.txt | \
              sort -u | \
              xargs -r find logs/package/feeds/ 2>/dev/null > logs.txt || true
            if [ -s logs.txt ]; then
              rsync -a --files-from=logs.txt logs/package/feeds/ faillogs/ || true
            fi
          fi

      - name: Upload failure logs
        if: ${{ always() && vars.RSYNC_BIN_URL != '' }}
        env:
          RSYNC_PASSWORD: ${{ secrets.RSYNC_BIN_PASSWORD }}
        run: |
          cd sdk
          # Create target directory
          rsync -4 -v --timeout=120 -a \
            --include "/${{ steps.parse.outputs.arch }}/" \
            --exclude "/*" \
            --exclude "/${{ steps.parse.outputs.arch }}/*" \
            bin/packages/ \
            "${{ vars.RSYNC_BIN_URL }}/faillogs/" || true

          # Upload logs
          rsync -4 -v --timeout=120 \
            --delete \
            --delay-updates \
            --partial-dir=".~tmp~${{ steps.parse.outputs.arch }}" \
            -az \
            faillogs/ \
            "${{ vars.RSYNC_BIN_URL }}/faillogs/${{ steps.parse.outputs.arch }}/" || true

      - name: Upload source archives
        if: ${{ vars.RSYNC_SRC_URL != '' }}
        env:
          RSYNC_PASSWORD: ${{ secrets.RSYNC_SRC_PASSWORD }}
        run: |
          cd sdk
          find dl/ -maxdepth 1 -type f -not -size 0 \
            -not -name '.*' -not -name '*.hash' -not -name '*.dl' \
            -newer ../sdk.archive -printf '%f\n' > sourcelist || true

          if [ -s sourcelist ]; then
            rsync -4 -v --timeout=120 \
              --files-from=sourcelist \
              --size-only \
              --delay-updates \
              --partial-dir=".~tmp~${{ steps.parse.outputs.arch }}" \
              -a \
              dl/ \
              "${{ vars.RSYNC_SRC_URL }}/" || true
          fi

      - name: Report disk usage
        if: always()
        run: |
          echo "=== Disk Usage ==="
          df -h .
          echo ""
          echo "=== Directory Size ==="
          du -sh .

      - name: Report ccache stats
        if: always()
        run: |
          ccache -s 2>/dev/null || true
