  build-packages:
    name: Build ${{ matrix.target_combo }}
    runs-on: docker
    strategy:
      matrix:
        target_combo:
          # - "bcm27xx:bcm2710:aarch64_cortex-a53"
          # - "bcm27xx:bcm2711:aarch64_cortex-a72"
          # - "bcm27xx:bcm2712:aarch64_cortex-a76"
          # - "armsr:armv8:aarch64_generic"
          # - "bcm27xx:bcm2708:arm_arm1176jzf-s_vfp"
          # - "at91:sam9x:arm_arm926ej-s"
          # - "armsr:armv7:arm_cortex-a15_neon-vfpv4"
          # - "at91:sama5:arm_cortex-a5_vfpv4"
          # - "mediatek:mt7629:arm_cortex-a7"
          # - "bcm27xx:bcm2709:arm_cortex-a7_neon-vfpv4"
          # - "at91:sama7:arm_cortex-a7_vfpv4"
          # - "omap:generic:arm_cortex-a8_vfpv3"
          # - "bcm53xx:generic:arm_cortex-a9"
          # - "imx:cortexa9:arm_cortex-a9_neon"
          # - "mvebu:cortexa9:arm_cortex-a9_vfpv3-d16"
          # - "gemini:generic:arm_fa526"
          # - "kirkwood:generic:arm_xscale"
          # - "ixp4xx:generic:armeb_xscale"
          # - "x86:legacy:i386_pentium-mmx"
          # - "x86:generic:i386_pentium4"
          # - "loongarch64:generic:loongarch64_generic"
          # - "malta:be64:mips64_mips64r2"
          # - "octeon:generic:mips64_octeonplus"
          # - "malta:le64:mips64el_mips64r2"
          # - "ath79:generic:mips_24kc"
          # - "bmips:bcm6318:mips_mips32"
          # - "malta:le:mipsel_24kc"
          # - "pistachio:generic:mipsel_24kc_24kf"
          # - "bcm47xx:mips74k:mipsel_74kc"
          # - "bcm47xx:generic:mipsel_mips32"
          # - "qoriq:generic:powerpc64_e5500"
          # - "apm821xx:nand:powerpc_464fp"
          # - "mpc85xx:p1010:powerpc_8548"
          # - "d1:generic:riscv64_generic"
          - "x86:64:x86_64"
      fail-fast: false
      max-parallel: 4

    steps:
      - name: Parse target combination
        id: parse
        run: |
          echo "Received target_combo: ${{ matrix.target_combo }}"
          # Split target_combo into components: target:subtarget:arch
          IFS=':' read -r TARGET SUBTARGET ARCH <<< "${{ matrix.target_combo }}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "subtarget=$SUBTARGET" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "Parsed: TARGET=$TARGET, SUBTARGET=$SUBTARGET, ARCH=$ARCH"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y jq zstd build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Checkout buildbot repo
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          echo "Building packages for ${{ steps.parse.outputs.arch }} (${{ steps.parse.outputs.target }}/${{ steps.parse.outputs.subtarget }})"
          mkdir -p sdk
          mkdir -p "$HOME/dl"

      - name: Download SDK
        run: |
          SDK_URL="${{ env.DOWNLOAD_BASE }}/${{ steps.parse.outputs.target }}/${{ steps.parse.outputs.subtarget }}"
          echo "Looking for SDK at: $SDK_URL"

          # Find SDK filename
          SDK_FILE=$(curl -s "${SDK_URL}/sha256sums" | grep -oP 'openwrt-sdk-[^*]+\.tar\.\w+' | head -1)

          if [ -z "$SDK_FILE" ]; then
            echo "ERROR: Could not find SDK file in sha256sums"
            exit 1
          fi

          echo "Downloading SDK: $SDK_FILE"
          curl -L -o sdk.archive "${SDK_URL}/${SDK_FILE}"

          # Verify download
          if [ ! -s sdk.archive ]; then
            echo "ERROR: SDK download failed or empty"
            exit 1
          fi

          echo "SDK downloaded successfully: $(ls -lh sdk.archive)"

      - name: Unpack SDK
        run: |
          rm -rf sdk_update
          mkdir sdk_update
          tar --strip-components=1 -C sdk_update/ -xf sdk.archive
          rsync -a --checksum sdk_update/ sdk/
          rm -rf sdk_update

      - name: Replace feed URLs with GitHub mirrors
        run: |
          cd sdk
          if [ -f feeds.conf.default ]; then
            echo "Replacing git.openwrt.org with github.com mirrors..."
            sed -i 's|https://git.openwrt.org/feed/|https://github.com/openwrt/|g' feeds.conf.default
            sed -i 's|https://git.openwrt.org/openwrt/|https://github.com/openwrt/|g' feeds.conf.default
            sed -i 's|https://git.openwrt.org/project/|https://github.com/openwrt/|g' feeds.conf.default
            echo "Updated feeds.conf.default:"
            cat feeds.conf.default
          fi
          cd ..

      - name: Sanitize host command symlinks
        run: |
          find sdk/staging_dir/host/bin/ -type l -exec sh -c '
            case $(readlink {}) in
              /bin/*|/usr/bin/*) true;;
              /*) rm -vf {};;
            esac
          ' \;

      - name: Get SDK version
        id: sdk-version
        run: |
          cd sdk
          cat > getversion.mk << 'EOF'
          TOPDIR:=${CURDIR}
          include $(TOPDIR)/include/version.mk
          version:
          	@echo $(VERSION_NUMBER)
          EOF
          VERSION=$(make -f getversion.mk)
          echo "SDK version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup download directory
        run: |
          mkdir -p "$HOME/dl"
          rm -rf sdk/dl
          ln -sf "$HOME/dl" sdk/dl

      - name: Configure SDK
        run: |
          cd sdk
          rm -f .config
          make defconfig

      - name: Setup SSH key
        if: ${{ secrets.SSH_PRIVATE_KEY != '' && secrets.RSYNC_SERVER != '' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Setup SSH config
          cat > ~/.ssh/config << EOF
          Host upload-server
            HostName ${{ secrets.RSYNC_SERVER }}
            Port ${{ secrets.RSYNC_PORT || '22' }}
            User ${{ secrets.RSYNC_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          echo "SSH configuration created"

      - name: Create remote directories
        if: ${{ secrets.SSH_PRIVATE_KEY != '' && secrets.RSYNC_SERVER != '' }}
        run: |
          # Test SSH connection and create directories early
          ssh upload-server "mkdir -p packages/${{ steps.parse.outputs.arch }} faillogs/${{ steps.parse.outputs.arch }}"
          echo "Remote directories created successfully"

      - name: Setup ccache
        run: |
          cd sdk
          ../scripts/ccache.sh

      - name: Update feeds
        run: |
          cd sdk
          ./scripts/feeds update -f

      - name: Install feeds
        run: |
          cd sdk
          ./scripts/feeds install -a

      - name: Download existing feeds.conf
        continue-on-error: true
        run: |
          cd sdk
          mkdir -p bin/packages/${{ steps.parse.outputs.arch }}
          # Try to download existing feeds.conf from downloads.openwrt.org
          curl -f -s -o bin/packages/${{ steps.parse.outputs.arch }}/feeds.conf.old \
            "https://downloads.openwrt.org/snapshots/packages/${{ steps.parse.outputs.arch }}/feeds.conf" || \
          echo "No existing feeds.conf found (this is normal for first build)"

      - name: Generate new feeds.conf
        run: |
          cd sdk
          mkdir -p bin/packages/${{ steps.parse.outputs.arch }}
          ./scripts/feeds list -s -f > bin/packages/${{ steps.parse.outputs.arch }}/feeds.conf

      - name: Detect changed feeds
        id: feed-diff
        run: |
          cd sdk

          echo "=== Detecting Changed Packages ==="
          ../scripts/detect_changed_packages.sh \
            bin/packages/${{ steps.parse.outputs.arch }}/feeds.conf.old \
            bin/packages/${{ steps.parse.outputs.arch }}/feeds.conf \
            > /tmp/build_targets.txt || {
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 2 ]; then
                echo "build_mode=full" >> "$GITHUB_OUTPUT"
                echo "Full build required (first build)"
                exit 0
              elif [ $EXIT_CODE -eq 3 ]; then
                echo "build_mode=full" >> "$GITHUB_OUTPUT"
                echo "Full build required (too many feeds changed)"
                exit 0
              else
                echo "build_mode=full" >> "$GITHUB_OUTPUT"
                echo "Full build required (no changes or error)"
                exit 0
              fi
            }

          # Check if incremental build is possible
          if [ -f /tmp/build_targets.txt ] && grep -q "^ALL$" /tmp/build_targets.txt; then
            echo "build_mode=full" >> "$GITHUB_OUTPUT"
            echo "Build mode: FULL"
          elif [ -s /tmp/build_targets.txt ]; then
            echo "build_mode=incremental" >> "$GITHUB_OUTPUT"
            echo "Build mode: INCREMENTAL"

            TARGET_COUNT=$(wc -l < /tmp/build_targets.txt)
            echo "Detected $TARGET_COUNT package(s) with changed Makefiles"
            echo ""
            echo "Packages to be built:"
            cat /tmp/build_targets.txt | sed -n 's|^package/feeds/[^/]*/\([^/]*\)/compile$|\1|p' | while read pkg; do
              echo "  - $pkg"
            done
          else
            echo "build_mode=full" >> "$GITHUB_OUTPUT"
            echo "Build mode: FULL (no package changes detected)"
          fi

      - name: Clear previous logs
        run: |
          cd sdk
          rm -rf logs/package/error.txt faillogs/

      - name: Build packages (full)
        if: steps.feed-diff.outputs.build_mode == 'full'
        run: |
          cd sdk
          echo "=== Building ALL packages ==="
          make -j$(nproc) \
            IGNORE_ERRORS="n m y" \
            BUILD_LOG=1 \
            CONFIG_AUTOREMOVE=y \
            CONFIG_SIGNED_PACKAGES= \
            V=s

      - name: Build packages (incremental)
        if: steps.feed-diff.outputs.build_mode == 'incremental'
        run: |
          cd sdk
          echo "=== Building packages incrementally ==="

          if [ -f /tmp/build_targets.txt ]; then
            TARGETS=$(cat /tmp/build_targets.txt | tr '\n' ' ')

            if [ -z "$TARGETS" ]; then
              echo "No targets to build, skipping"
              exit 0
            fi

            echo "Building specific targets..."
            make -j$(nproc) \
              IGNORE_ERRORS="n m y" \
              BUILD_LOG=1 \
              CONFIG_AUTOREMOVE=y \
              CONFIG_SIGNED_PACKAGES= \
              V=s \
              $TARGETS
          else
            echo "No build targets file found, skipping"
          fi

      - name: Calculate checksums
        run: |
          cd sdk/
          make package/index V=s

      - name: Setup SSH key
        if: ${{ secrets.SSH_PRIVATE_KEY != '' && secrets.RSYNC_SERVER != '' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Setup SSH config
          cat > ~/.ssh/config << EOF
          Host upload-server
            HostName ${{ secrets.RSYNC_SERVER }}
            Port ${{ secrets.RSYNC_PORT || '22' }}
            User ${{ secrets.RSYNC_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          echo "SSH configuration created"

      - name: Upload packages via SSH
        if: ${{ secrets.SSH_PRIVATE_KEY != '' && secrets.RSYNC_SERVER != '' }}
        run: |
          cd sdk
          # Upload packages using rsync over SSH
          rsync -avz --progress \
            -e "ssh -F ~/.ssh/config" \
            bin/packages/${{ steps.parse.outputs.arch }}/ \
            upload-server:packages/${{ steps.parse.outputs.arch }}/

          echo "Packages uploaded successfully"

      - name: Collect failure logs
        if: always()
        run: |
          cd sdk
          mkdir -p faillogs
          if [ -f logs/package/error.txt ]; then
            sed -ne 's!^ *ERROR: package/feeds/\([^ ]*\) .*$!\1!p' logs/package/error.txt | \
              sort -u | \
              xargs -r find logs/package/feeds/ 2>/dev/null > logs.txt || true
            if [ -s logs.txt ]; then
              rsync -a --files-from=logs.txt logs/package/feeds/ faillogs/ || true
            fi
          fi

      - name: Upload failure logs via SSH
        if: ${{ always() && secrets.SSH_PRIVATE_KEY != '' && secrets.RSYNC_SERVER != '' }}
        run: |
          cd sdk
          if [ -d faillogs ] && [ "$(ls -A faillogs)" ]; then
            # Upload failure logs
            rsync -avz --progress \
              -e "ssh -F ~/.ssh/config" \
              faillogs/ \
              upload-server:faillogs/${{ steps.parse.outputs.arch }}/ || true

            echo "Failure logs uploaded"
          else
            echo "No failure logs to upload"
          fi

      - name: Report disk usage
        if: always()
        run: |
          echo "=== Disk Usage ==="
          df -h .
          echo ""
          echo "=== Directory Size ==="
          du -sh .

      - name: Report ccache stats
        if: always()
        run: |
          ccache -s 2>/dev/null || true
